[workspace]
resolver = "2"
members = ["crates/sidestage-core", "crates/sidestage-platform", "crates/sidestage"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danny19862025/sidestage"

[workspace.dependencies]
sidestage-core = { path = "crates/sidestage-core" }
sidestage-platform = { path = "crates/sidestage-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
