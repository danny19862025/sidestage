[package]
name = "sidestage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A favourites + minimized-windows sidebar for Windows and Linux"

[dependencies]
sidestage-core.workspace = true
sidestage-platform.workspace = true
log.workspace = true
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.37"
raw-window-handle = "0.6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

