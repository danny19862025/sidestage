[package]
name = "sidestage-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Window-manager, launcher, icon and panel integration for Sidestage (Windows, KDE, GNOME, X11)"

[dependencies]
sidestage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
anyhow.workspace = true
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "bmp"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
x11rb = { version = "0.13", features = ["randr", "shape", "xtest", "allow-unsafe-code"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
resvg = "0.45"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }
