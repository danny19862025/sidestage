name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libgtk-3-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo build --release -p sidestage
      - name: Package
        run: |
          mkdir -p dist/sidestage
          cp target/release/sidestage dist/sidestage/
          cp -r packaging integrations scripts/install-linux.sh scripts/uninstall-linux.sh README.md LICENSE dist/sidestage/
          tar -C dist -czf sidestage-linux-x64.tar.gz sidestage
      - uses: actions/upload-artifact@v4
        with:
          name: sidestage-linux-x64
          path: sidestage-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo build --release -p sidestage
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'sidestage' | ForEach-Object version
          & $iscc /Q "/DAppVersion=$version" installer\Sidestage.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\sidestage.exe dist\sidestage-windows-x64-portable.exe
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: sidestage-windows-x64
          path: |
            dist/Sidestage-Setup-*.exe
            dist/sidestage-windows-x64-portable.exe

  # Pushing a version tag (e.g. v0.2.0) publishes a GitHub release with the
  # Windows installer, the portable Windows exe and the Linux tarball.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Sidestage-Setup-*.exe
            artifacts/sidestage-windows-x64-portable.exe
            artifacts/sidestage-linux-x64.tar.gz
